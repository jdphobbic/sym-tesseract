<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — TESSERACT ’26</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <div class="brand-icon">T</div>
                <div>
                    <span class="brand-title">TESSERACT ’26</span>
                    <span class="brand-sub">Management Portal</span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Back to Website</a></li>
            </ul>
        </div>
    </nav>

    <!-- LOGIN CONTAINER -->
    <main class="container" style="max-width: 460px; margin: auto; padding: 2rem 1.5rem;">
        <div class="glass-card" style="border-color: var(--primary-cyan); padding: 2.5rem 2rem; text-align: center; box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);">
            
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
            <h2 style="font-family: var(--font-heading); color: #fff; font-size: 1.8rem; letter-spacing: 1px; margin-bottom: 0.3rem;">
                ADMIN PORTAL LOGIN
            </h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem;">
                Please authenticate to access symposium controls & records.
            </p>

            <div id="login-error" class="invalid-feedback" style="display: none; margin-bottom: 1.25rem; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); padding: 0.75rem; border-radius: 6px; color: #f87171;">
            </div>

            <form id="admin-login-form" onsubmit="handleAdminLogin(event)" style="text-align: left;">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label" style="font-size: 0.8rem; color: #94a3b8;">USERNAME</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter admin username" required autofocus style="background: rgba(5,8,19,0.8);">
                </div>

                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label class="form-label" style="font-size: 0.8rem; color: #94a3b8;">PASSWORD</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required style="background: rgba(5,8,19,0.8);">
                </div>

                <button type="submit" id="btn-login" class="btn-cyan-solid" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; font-weight: 700; cursor: pointer;">
                    🔓 SIGN IN TO DASHBOARD
                </button>
            </form>

        </div>
    </main>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errDiv = document.getElementById('login-error');
            errDiv.style.display = 'none';

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = 'Verifying Credentials...';

            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = '🔓 SIGN IN TO DASHBOARD';

                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    errDiv.innerText = data.message || 'Invalid username or password.';
                    errDiv.style.display = 'block';
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = '🔓 SIGN IN TO DASHBOARD';
                errDiv.innerText = 'Network error while connecting to server.';
                errDiv.style.display = 'block';
            });
        }
    </script>
</body>
</html>
